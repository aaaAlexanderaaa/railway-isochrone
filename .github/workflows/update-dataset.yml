name: update-dataset
on:
  schedule:
    # 上游 GTFS 周更；周一 UTC 6:00 ≈ 北京时间下午
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch latest GTFS and rebuild net.json
        run: python3 scripts/update_dataset.py
      - name: Rotate invariants
        run: python3 scripts/test_update_dataset.py
      - name: Engine regression
        run: node test_engine.js
      - name: Commit if changed
        run: |
          git config user.name "dataset-bot"
          git config user.email "dataset-bot@users.noreply.github.com"
          git add public/data data/gtfs data/RELEASE public/engine.js vendor/chinese-railway-gtfs
          git diff --cached --quiet && echo "no dataset change" && exit 0
          git commit -m "chore: 更新铁路 GTFS 周更快照"
          git push
